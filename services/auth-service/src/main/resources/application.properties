spring.application.name=auth-service

server.port=8081

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/applyforonce_auth}
spring.datasource.username=postgres
spring.datasource.password=AFO@123

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Application logging
logging.level.root=INFO
logging.level.com.applyforonce.auth=DEBUG

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
